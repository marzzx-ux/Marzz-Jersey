<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rekomendasi Jersey</title>
  <link rel="stylesheet" href="sld.css">
</head>
<body>

<h2 class="title">Rekomendasi Jersey</h2>

<div class="slider-container">
  <div class="slider">

    <div class="slide active">
      <img src="img/jersey1.jpg" alt="Jersey 1">
      <div class="caption">
        <h3>Jersey Real Madrid</h3>
        <p>Rp 250.000</p>
      </div>
    </div>

    <div class="slide">
      <img src="img/jersey2.jpg" alt="Jersey 2">
      <div class="caption">
        <h3>Jersey Barcelona</h3>
        <p>Rp 240.000</p>
      </div>
    </div>

    <div class="slide">
      <img src="img/jersey3.jpg" alt="Jersey 3">
      <div class="caption">
        <h3>Jersey Manchester United</h3>
        <p>Rp 260.000</p>
      </div>
    </div>
  </div>

  <button class="prev" onclick="prevSlide()">❮</button>
  <button class="next" onclick="nextSlide()">❯</button>
</div>

<script src="sld.js"></script>
</body>
</html>
