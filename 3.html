<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jersey Store</title>
    <link rel="stylesheet" href="3.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>⚽ JerseyStore</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Produk</a></li>
            <li><a href="#">Keranjang</a></li>
        </ul>
    </nav>

    <!-- Hero -->
    <section class="slider">
    <div class="slider-wrapper">
        <div class="slides">
            <img src="mun.jpg">
            <img src="jut.jpg">
            <img src="ct.jpg">
           <img src="liv.jpg">
            
           
            <img src="mun.jpg" alt="Bayern Clone">
        </div>
    </div>
</section>

    <!-- Rekomendasi -->
    <section class="rekomendasi">
        <h2>🔥 Rekomendasi Jersey</h2>
        <div class="card-container">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1521417531039-78d33a7c1e3f">
                <h3>Real Madrid 2026</h3>
                <p>Rp 350.000</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1517927033932-b3d18e61fb3a">
                <h3>Barcelona 2026</h3>
                <p>Rp 340.000</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2">
                <h3>Manchester City 2026</h3>
                <p>Rp 360.000</p>
            </div>
        </div>
    </section>

<script src="3.js"></script>
</body>
</html>
